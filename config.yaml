requests:
  base_url: https://portaldatransparencia.gov.br/download-de-dados
  endpoints:
    monthly: [compras, licitacoes]  # one file per month, history kept
    snapshot: [ceis, cnep]  # only the latest day's file is kept
  chunk_size: 1MiB  # 1MiB = 1024 * 1024 bytes; 1MB = 1000 * 1000 bytes.
  tmp_dir: /tmp/kybr_pipeline

s3:
  bucket_name: aws-s3-kybr

schemas:
  compras:
    - name: compras
      columns:
        - name: 'Número do Contrato'
          bronze_name: numero_do_contrato
          type: string
        - name: 'Objeto'
          bronze_name: objeto
          type: string
        - name: 'Fundamento Legal'
          bronze_name: fundamento_legal
          type: string
        - name: 'Modalidade Compra'
          bronze_name: modalidade_compra
          type: string
        - name: 'Situação Contrato'
          bronze_name: situacao_contrato
          type: string
        - name: 'Código Órgão Superior'
          bronze_name: codigo_orgao_superior
          type: string
        - name: 'Nome Órgão Superior'
          bronze_name: nome_orgao_superior
          type: string
        - name: 'Código Órgão'
          bronze_name: codigo_orgao
          type: string
        - name: 'Nome Órgão'
          bronze_name: nome_orgao
          type: string
        - name: 'Código UG'
          bronze_name: codigo_ug
          type: string
        - name: 'Nome UG'
          bronze_name: nome_ug
          type: string
        - name: 'Data Assinatura Contrato'
          bronze_name: data_assinatura_contrato
          type: date
        - name: 'Data Publicação DOU'
          bronze_name: data_publicacao_dou
          type: date
        - name: 'Data Início Vigência'
          bronze_name: data_inicio_vigencia
          type: date
        - name: 'Data Fim Vigência'
          bronze_name: data_fim_vigencia
          type: date
        - name: 'Código Contratado'
          bronze_name: codigo_contratado
          type: string
        - name: 'Nome Contratado'
          bronze_name: nome_contratado
          type: string
        - name: 'Valor Inicial Compra'
          bronze_name: valor_inicial_compra
          type: decimal(18,4)
        - name: 'Valor Final Compra'
          bronze_name: valor_final_compra
          type: decimal(18,4)
        - name: 'Número Licitação'
          bronze_name: numero_licitacao
          type: string
        - name: 'Código UG Licitação'
          bronze_name: codigo_ug_licitacao
          type: string
        - name: 'Nome UG Licitação'
