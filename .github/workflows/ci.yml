# Lint and test every pull request and every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the run still going on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # uv reads the Python version from .python-version.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github

      # The tests use fakes and a local HTTP server: no network or AWS.
      - name: Test
        run: uv run pytest -vv

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2

      - name: Check the format
        run: terraform fmt -check -recursive infra

      # -backend=false skips the S3 state, so no AWS credentials needed.
      - name: Validate the main stack
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Validate the bootstrap stack
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

  version:
    name: Version bump
    # Every pull request must bump the version (see CONTRIBUTING.md).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --depth=1 origin "$BASE_REF"

      # Fails, with an annotation on the PR, if the version is not
      # greater than the base branch's or has no CHANGELOG.md section.
      - name: Check the version was bumped
        env:
          BASE_REF: ${{ github.base_ref }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          base_ref = os.environ["BASE_REF"]
          base_toml = subprocess.run(
              ["git", "show", f"origin/{base_ref}:pyproject.toml"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          base = tomllib.loads(base_toml)["project"]["version"]
          head = tomllib.loads(Path("pyproject.toml").read_text())[
              "project"
          ]["version"]

          def key(version):
              return tuple(int(part) for part in version.split("."))

          errors = []
          if key(head) <= key(base):
              errors.append(
                  f"version {head} is not greater than {base} on"
                  f" {base_ref}: run `uv version --bump"
                  " <major|minor|patch>`"
              )
          if f"## [{head}]" not in Path("CHANGELOG.md").read_text():
              errors.append(f"CHANGELOG.md has no '## [{head}]' section")

          for error in errors:
              print(f"::error file=pyproject.toml::{error}")
          if not errors:
              print(f"version bumped: {base} -> {head}")
          sys.exit(1 if errors else 0)
