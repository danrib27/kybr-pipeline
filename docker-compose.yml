services:
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: kybr-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - 9000:9000  # S3 API
      - 9001:9001  # web console
    volumes:
      - rustfs_data:/data

  rustfs-init:
    image: amazon/aws-cli:2.38.1
    container_name: kybr-rustfs-init
    environment:
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_REGION: us-east-1
      BUCKET: ${S3_BUCKET:-aws-s3-kybr}
    entrypoint: ["sh", "-c"]
    command:
      - |
        until aws s3 ls > /dev/null 2>&1; do sleep 1; done
        aws s3api head-bucket --bucket "$$BUCKET" 2> /dev/null \
          || aws s3 mb "s3://$$BUCKET"
    depends_on:
      - rustfs

volumes:
  rustfs_data:
    driver: local
